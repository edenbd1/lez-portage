# wrap_bridge on LEZ v0.4.0-rc1: the same bridge as programs/wrap_bridge
# (v0.3), ported to the actor model. One run handles one message to one actor
# (an account paired with this program) and may change only that actor's
# state; everything else is a message to another actor. See docs/V04-PORT.md.
[workspace]

[package]
name = "wrap-bridge-v04"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wrap_bridge"
path = "src/bin/wrap_bridge.rs"

[dependencies]
wrap-core = { path = "../../../core" }
# The Attest message and the statement types: Sextant's own (sextant-core),
# sent to the Attest half of Sextant ported to v0.4 (../sextant_attest).
sextant-core = { git = "https://github.com/edenbd1/lez-sextant", rev = "81532728a94be3faedb05229b118a6df7527d974", default-features = false }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh      = { version = "1.5", features = ["derive"] }

[dev-dependencies]
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["host"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[patch.crates-io]
blst        = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
