# The Attest half of Sextant (RFP-021, edenbd1/lez-sextant `programs/sextant`)
# on LEZ v0.4.0-rc1's actor model: a header record actor per finalized header,
# and `Attest`, the consumer check wrap_bridge's Claim sends it, verbatim
# (sextant-core's `statement::evaluate`). The light client that writes the
# records is NOT ported: here a record is written by one pinned key, a
# stand-in stated in docs/V04-PORT.md.
[workspace]

[package]
name = "sextant-attest-v04"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sextant_attest"
path = "src/bin/sextant_attest.rs"

[dependencies]
wrap-core = { path = "../../../core" }
sextant-core = { git = "https://github.com/edenbd1/lez-sextant", rev = "81532728a94be3faedb05229b118a6df7527d974", default-features = false }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh      = { version = "1.5", features = ["derive"] }

[dev-dependencies]
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["host"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[patch.crates-io]
blst        = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
