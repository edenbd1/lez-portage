# The v0.4 spike's programs (v04/artifacts: the canonical token program's
# actor-model port, Sextant's Attest half, wrap_bridge) through
# `lee::V03State` at LEZ v0.4.0-rc1, the state machine its sequencer settles
# public transactions with, on the anvil deposits of vectors/anvil; and the
# v0.4 block mirror of chain/ (chain/v04) against LEZ's own block types.
# Cargo.lock started from LEZ v0.4.0-rc1's own lockfile.
[workspace]

[package]
name = "wrap-executor-tests-v04"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
wrap-bridge-v04 = { path = "../programs/wrap_bridge" }
sextant-attest-v04 = { path = "../programs/sextant_attest" }
wrap-core = { path = "../../core" }
lez-chain = { path = "../../chain" }
lez-chain-v04 = { path = "../../chain/v04" }
sextant-core = { git = "https://github.com/edenbd1/lez-sextant", rev = "81532728a94be3faedb05229b118a6df7527d974", default-features = false }
lee        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["host"] }
common     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
borsh = { version = "1.5", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
risc0-binfmt = "3.0"
risc0-zkvm = { version = "=3.0.5", features = ["client"] }
risc0-zkos-v1compat = "=2.2.2"

[[bin]]
name = "pack"
path = "src/bin/pack.rs"
[[bin]]
name = "image_id"
path = "src/bin/image_id.rs"
[[bin]]
name = "seq_drive"
path = "src/bin/seq_drive.rs"
[[bin]]
name = "measure_chain"
path = "src/bin/measure_chain.rs"
