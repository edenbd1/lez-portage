# The v0.4 port's programs (v04/artifacts: the canonical token program's
# actor-model port, Sextant's light client sextant_lc, wrap_bridge) through
# `lee::V03State` at LEZ v0.4.0-rc3, the state machine its sequencer settles
# public transactions with, on the anvil deposits of vectors/anvil; and the
# v0.4 block mirror of chain/ (chain/v04) against LEZ's own block types.
# Cargo.lock started from LEZ v0.4.0-rc1's own lockfile.
[workspace]

[package]
name = "wrap-executor-tests-v04"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
wrap-bridge-v04 = { path = "../programs/wrap_bridge" }
# Sextant's light client on v0.4 (lez-sextant branch `v0.4`): its messages and
# account derivations; the binary is v04/artifacts/sextant_lc.bin.
sextant-program-v04 = { git = "https://github.com/edenbd1/lez-sextant", rev = "1e55629a80117bc9e8caed35439df86ec6433dff" }
wrap-core = { path = "../../core" }
lez-chain = { path = "../../chain" }
lez-chain-v04 = { path = "../../chain/v04" }
# The real vector sets (vectors/ of lez-sextant at that commit): the Sepolia
# checkpoint of the Portage vault deposits.
sextant-host = { git = "https://github.com/edenbd1/lez-sextant", rev = "1e55629a80117bc9e8caed35439df86ec6433dff" }
sextant-core = { git = "https://github.com/edenbd1/lez-sextant", rev = "1e55629a80117bc9e8caed35439df86ec6433dff", default-features = false }
lee        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3", features = ["host"] }
common     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
borsh = { version = "1.5", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
risc0-binfmt = "3.0"
risc0-zkvm = { version = "=3.0.5", features = ["client"] }
risc0-zkos-v1compat = "=2.2.2"

[[bin]]
name = "pack"
path = "src/bin/pack.rs"
[[bin]]
name = "image_id"
path = "src/bin/image_id.rs"
[[bin]]
name = "seq_drive"
path = "src/bin/seq_drive.rs"
[[bin]]
name = "measure_chain"
path = "src/bin/measure_chain.rs"
