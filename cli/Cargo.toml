# `wrap`: the client of the RFP-022 prototype on a LEZ v0.3 sequencer. It
# loads the four committed program binaries (Sextant's sextant_lc, LEZ v0.3.0's
# token and associated-token-account programs, wrap_bridge) through
# program_loader, initialises a Sextant instance and the bridge, and sends
# claims (public, or privacy-preserving into a shielded account, proven here)
# and burns against deposits made into WrapVault on a local anvil chain.
# Built on the v0.3.0 `wallet` crate for keys, private-account sync and the
# privacy-preserving send; it builds and signs its own public transactions so
# that every one declares an explicit gas limit.
[workspace]

[package]
name = "wrap-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "wrap"
path = "src/main.rs"

[dependencies]
wrap-bridge = { path = "../programs/wrap_bridge" }
wrap-core = { path = "../core", features = ["zk"] }
lez-chain = { path = "../chain", features = ["release"] }
lez-bedrock = { path = "../bedrock", features = ["release"] }
bincode = "1.3"
wrap-executor-tests = { path = "../executor-tests" }
sextant-program = { git = "https://github.com/edenbd1/lez-sextant", rev = "81532728a94be3faedb05229b118a6df7527d974" }
sextant-core = { git = "https://github.com/edenbd1/lez-sextant", rev = "81532728a94be3faedb05229b118a6df7527d974", default-features = false }
wallet     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
lee        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77", features = ["host"] }
common     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77", features = ["client"] }
risc0-binfmt = "3.0"
# The zero-knowledge release proof (src/zk.rs), through r0vm.
risc0-zkvm = { version = "=3.0.5", features = ["client"] }
tokio  = { version = "1", features = ["macros", "rt-multi-thread"] }
clap   = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
hex    = "0.4"
borsh  = { version = "1.5", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# The public testnet and the local sequencer run v0.3.1, whose blocks a v0.3.0
# `common` cannot decode (a private account's sync fails on the first block).
# See vendor/lez-common/Cargo.toml.
[patch."https://github.com/logos-blockchain/logos-execution-zone.git"]
common = { path = "vendor/lez-common" }

