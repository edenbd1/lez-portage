# pol-measure host: builds the guest's jobs from the Bedrock node's own code at
# 3926a532 (a fresh PoL proof with `lb_pol::prove` under the v0.5.7 circuit's
# proving key, checked with `lb_pol::verify`; the public-testnet headers'
# proofs; note-set updates on a real `lb_utxotree::UtxoTree`), checks the
# measured implementations natively against the node's, then runs the guest
# in r0vm 3.0.5 (execute, optionally prove) and prints the cycle counts.
[workspace]

[package]
name = "pol-measure"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
pol-measure-core = { path = "../core" }
lb-pol      = { package = "logos-blockchain-pol", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "3926a532b9d96d62747da064161a115a7c0c5a3e" }
lb-groth16  = { package = "logos-blockchain-groth16", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "3926a532b9d96d62747da064161a115a7c0c5a3e" }
lb-utxotree = { package = "logos-blockchain-utxotree", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "3926a532b9d96d62747da064161a115a7c0c5a3e" }
lb-poseidon2 = { package = "logos-blockchain-poseidon2", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "3926a532b9d96d62747da064161a115a7c0c5a3e" }
lb-utils    = { package = "logos-blockchain-utils", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "3926a532b9d96d62747da064161a115a7c0c5a3e" }
lbc-pol-sys = { package = "logos-blockchain-circuits-pol-sys", git = "https://github.com/logos-blockchain/logos-blockchain-circuits.git", tag = "v0.5.7", features = ["prebuilt"] }
ark-bn254     = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec        = { version = "0.5", default-features = false }
ark-ff        = { version = "0.5", default-features = false }
ark-groth16   = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
substrate-bn  = { version = "0.6", default-features = false }
num-bigint = "0.4"
serde_json = "1"
hex = "0.4"
borsh = "1.5"
risc0-zkvm = { version = "=3.0.5", features = ["client"] }

[patch.crates-io]
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
