# lez-chain-v04: chain/ for LEZ v0.4 blocks (rc1 to rc3) (docs/V04-PORT.md). A crate
# of its own so that the v0.3.1 crate, and the committed guests built from it
# (artifacts/zk/lez_chain.bin and the guests that link it), stay byte for byte.
[package]
name = "lez-chain-v04"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lez-chain = { path = ".." }
wrap-core = { path = "../../core" }
borsh = { version = "1.5", features = ["derive"] }
