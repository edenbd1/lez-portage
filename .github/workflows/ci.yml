name: CI
on:
  push:
  pull_request:
jobs:
  vault:
    name: WrapVault (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root vault -vv
      # ZkBurnVerifier.t.sol runs on a committed real Groth16 seal (vault/test/fixtures,
      # scripts/zk-fixture.sh); the Groth16 prover itself needs x86_64 Docker and is run locally.
      # Each check of the release path (both verifiers, their committee, the vault's digest and
      # nullifier) removed in turn.
      - run: scripts/mutation-test-vault.sh
  core:
    name: wrap-core (hashes shared with the vault)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --manifest-path core/Cargo.toml
      # The zero-knowledge release statement (src/zk.rs, feature zk).
      - run: cargo test --release --manifest-path core/Cargo.toml --features zk
      # The chain-derived release's statement (chain/: LEZ blocks, the burn tree, both journals).
      - run: cargo test --release --manifest-path chain/Cargo.toml --features release
      # The Bedrock anchor's statement (bedrock/: headers, body root, Merkle path, the inscription
      # and its signature, the header chain, on a real public-testnet anchor in vectors/bedrock),
      # and each of its checks removed in turn.
      - run: cargo test --release --manifest-path bedrock/Cargo.toml --features release
      - run: scripts/mutation-test-bedrock.sh
  executor:
    name: The committed binaries through lee::V03State
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: RISC0
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
      # The executor runs the programs in r0vm. rzup asks api.github.com for
      # release metadata; anonymous calls from a shared runner hit the rate
      # limit, so authenticate and retry.
      - name: r0vm 3.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do rzup install r0vm 3.0.5 && exit 0; sleep $((i * 20)); done
          exit 1
      - run: cargo test --release --manifest-path executor-tests/Cargo.toml
      - name: The gas table is reproducible
        run: cargo run --release --manifest-path executor-tests/Cargo.toml --bin measure | tee measure.txt
      # The privacy-preserving claim, in RISC Zero dev mode: the programs and
      # the privacy circuit execute, every settlement check but the receipt's
      # seal runs, and every privacy assertion is the same. Real proving is
      # measured locally (docs/PRIVATE-CLAIM-MEASURED.md): it needs ~7 GB and
      # minutes per claim.
      - name: The private claim (dev mode)
        env:
          RISC0_DEV_MODE: "1"
        run: cargo test --release --manifest-path executor-tests/Cargo.toml --test private -- --ignored
  reproduce:
    name: A clean Docker rebuild is the committed wrap_bridge.bin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: RISC0
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
      # The build runs in RISC Zero's pinned builder image (r0.1.91.1);
      # cargo-risczero still refuses to start without a host guest toolchain.
      - name: cargo-risczero 3.0.5, r0vm 3.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            rzup install cargo-risczero 3.0.5 && rzup install r0vm 3.0.5 && rzup install rust && exit 0
            sleep $((i * 20))
          done
          exit 1
      - run: |
          cp artifacts/programs/v0.3/wrap_bridge.bin /tmp/committed.bin
          DOCKER=1 scripts/build-guest.sh
          cmp /tmp/committed.bin artifacts/programs/v0.3/wrap_bridge.bin
          sha256sum artifacts/programs/v0.3/wrap_bridge.bin
      # The zero-knowledge release guest, whose image id ZkBurnVerifier is
      # pinned to and the Foundry fixture was proven with.
      - run: |
          cp artifacts/zk/burn_membership.bin /tmp/committed-zk.bin
          scripts/build-zk-guest.sh
          cmp /tmp/committed-zk.bin artifacts/zk/burn_membership.bin
      # The chain-derived release's two guests, pinned in ZkChainBurnVerifier.
      - run: |
          cp artifacts/zk/lez_chain.bin /tmp/committed-chain.bin
          cp artifacts/zk/burn_release.bin /tmp/committed-release.bin
          scripts/build-chain-guests.sh
          cmp /tmp/committed-chain.bin artifacts/zk/lez_chain.bin
          cmp /tmp/committed-release.bin artifacts/zk/burn_release.bin
      # The Bedrock-anchored release's two guests, pinned in ZkBedrockBurnVerifier.
      - run: |
          cp artifacts/zk/bedrock_anchor.bin /tmp/committed-anchor.bin
          cp artifacts/zk/bedrock_release.bin /tmp/committed-bedrock-release.bin
          scripts/build-bedrock-guests.sh
          cmp /tmp/committed-anchor.bin artifacts/zk/bedrock_anchor.bin
          cmp /tmp/committed-bedrock-release.bin artifacts/zk/bedrock_release.bin
  mutation:
    name: Each guard of wrap_bridge, removed, fails the tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: RISC0
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
      # Each mutation is a local guest build: the RISC Zero Rust and C
      # toolchains, not the Docker builder.
      - name: r0vm 3.0.5, RISC Zero rust and cpp toolchains
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            rzup install r0vm 3.0.5 && rzup install rust && rzup install cpp && exit 0
            sleep $((i * 20))
          done
          exit 1
      - run: cargo build --release --manifest-path executor-tests/Cargo.toml --tests --bins
      - run: scripts/mutation-test.sh
