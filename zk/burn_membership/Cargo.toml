# burn_membership: the zero-knowledge release guest (F.7 part 1, PP.2).
#
# It proves, in RISC Zero, that the prover knows a burn in the LEZ bridge's
# burn tree (its token, amount, Ethereum recipient, relayer fee, secret, index
# and path) under the root its path leads to, and commits as its journal the
# vault's release preimage (wrap_core::release_preimage) of that root and the
# burn's nullifier. The vault never sees the secret, the index or the path.
# Its receipt is wrapped in Groth16 and checked on Ethereum by RISC Zero's
# RiscZeroGroth16Verifier, behind vault/src/ZkBurnVerifier.sol.
[workspace]

[package]
name = "burn_membership"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
wrap-core = { path = "../../core", features = ["zk"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# RISC Zero's accelerated SHA-256 (the tree is 24 levels of it).
[patch.crates-io]
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
