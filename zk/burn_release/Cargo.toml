# burn_release: the zero-knowledge release over a chain-derived burn tree
# (F.7). It proves what zk/burn_membership proves (a burn of the tree, its
# opening kept private, the vault's release preimage as the journal), against
# the root of a tree the LEZ chain guest zk/lez_chain rebuilt from LEZ blocks,
# whose receipt it verifies inside (an assumption, resolved before Groth16).
# Journal: the 352-byte release preimage, then the chain receipt's image id,
# the deployment, the anchor and the last block it covers (lez_chain::release_tail).
[workspace]

[package]
name = "burn_release"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lez-chain = { path = "../../chain", features = ["release"] }
wrap-core = { path = "../../core", features = ["zk"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[patch.crates-io]
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
