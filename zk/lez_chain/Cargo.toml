# lez_chain: the LEZ chain guest of the chain-derived release (F.7).
#
# It reads LEZ v0.3.1 blocks as the sequencer returns them (borsh), checks
# each one's hash against its contents and its link to the previous one, from
# a fixed anchor block or from an earlier receipt of itself (verified inside,
# as an assumption), and rebuilds the tree of the wrap_bridge burns that
# privacy-preserving transactions settled. Its journal (lez_chain::journal)
# names its own image id, the deployment, the anchor, the last block and the
# tree. The release guest zk/burn_release proves a burn under that tree's root.
[workspace]

[package]
name = "lez_chain"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lez-chain = { path = "../../chain" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# RISC Zero's accelerated SHA-256: every block byte is hashed once.
[patch.crates-io]
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
