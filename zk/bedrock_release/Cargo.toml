# bedrock_release: the zero-knowledge release over a Bedrock-anchored chain (F.7).
#
# It proves what zk/burn_release proves (a burn of the chain-derived tree, its
# opening kept private, the vault's release preimage as the journal's first
# 352 bytes), against the chain journal inside a receipt of zk/bedrock_anchor,
# which it verifies inside (an assumption, under the image id the anchor
# journal names for itself). That receipt carries the chain receipt's, so one
# Groth16 seal covers the three guests. Journal: lez_bedrock::compose::
# release_journal (the preimage, lez-chain's 7-word tail, the 7-word Bedrock tail).
[workspace]

[package]
name = "bedrock_release"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lez-bedrock = { path = "../../bedrock", features = ["release"] }
lez-chain = { path = "../../chain", features = ["release"] }
wrap-core = { path = "../../core", features = ["zk"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# The same patches as zk/bedrock_anchor (this guest hashes with SHA-256 only).
[patch.crates-io]
sha2             = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak      = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }
crypto-bigint    = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
