# bedrock_anchor: the Bedrock anchor of a LEZ chain proof (F.7).
#
# It verifies a receipt of the chain guest zk/lez_chain inside (an assumption,
# under the image id the chain journal names for itself), then proves that the
# LEZ block that chain ends at is inscribed on Bedrock: the first operation of
# a Mantle transaction on the pinned channel, signed by the pinned sequencer key
# (Ed25519 verify_strict over the transaction hash), the transaction under the
# Merkle root a Bedrock block header's body root commits to, and a chain of
# Bedrock headers built on that block (each the parent of the next, at later
# slots). Journal: lez_bedrock::compose::anchor_journal (its own image id, the
# channel and key, the Bedrock block, the top header and the depth, then the
# chain journal). The release guest zk/bedrock_release proves a burn under it.
[workspace]

[package]
name = "bedrock_anchor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lez-bedrock = { path = "../../bedrock", features = ["chain"] }
lez-chain = { path = "../../chain" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# RISC Zero's accelerated SHA-256 (the LEZ block's hash) and curve25519
# (the inscription's Ed25519 signature). Blake2b has no accelerator.
[patch.crates-io]
sha2             = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak      = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }
crypto-bigint    = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
