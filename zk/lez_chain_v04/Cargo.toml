# lez_chain_v04: the LEZ chain guest for LEZ v0.4 blocks (rc1 to rc3) (chain/v04).
#
# It reads v0.4 blocks as the sequencer returns them (borsh), checks each
# one's hash against its contents (the reverted list included) and its link to
# the previous one from a fixed anchor, and rebuilds the tree of the burns
# that the blocks' root calls made and that did not revert: public burns,
# which v0.3.1 blocks could not tell from refused ones. Journal:
# lez_chain_v04::journal. A spike: no recursion over a prior receipt yet
# (zk/lez_chain has it for v0.3.1).
[workspace]

[package]
name = "lez_chain_v04"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lez-chain-v04 = { path = "../../chain/v04" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[patch.crates-io]
sha2        = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
