# The three committed program binaries (Sextant's sextant_lc, LEZ v0.3.0's
# token program, and wrap_bridge) through `lee::V03State`, the state machine
# the LEZ v0.3 sequencer applies public transactions with, under the
# 10,000,000 gas cap, on deposits made into vault/src/WrapVault.sol on a local
# anvil chain (vectors/anvil, scripts/anvil-vectors.sh).
[workspace]

[package]
name = "wrap-executor-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
wrap-bridge = { path = "../programs/wrap_bridge" }
wrap-core = { path = "../core" }
sextant-program = { git = "https://github.com/edenbd1/lez-sextant", rev = "81532728a94be3faedb05229b118a6df7527d974" }
sextant-core = { git = "https://github.com/edenbd1/lez-sextant", rev = "81532728a94be3faedb05229b118a6df7527d974", default-features = false }
lee        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77", features = ["host"] }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
borsh = { version = "1.5", features = ["derive"] }
serde_json = "1"
hex = "0.4"
risc0-binfmt = "3.0"
risc0-zkvm = { version = "=3.0.5", features = ["client"] }
risc0-zkos-v1compat = "=2.2.2"

[[bin]]
name = "pack"
path = "src/bin/pack.rs"
[[bin]]
name = "image_id"
path = "src/bin/image_id.rs"
[[bin]]
name = "vectors"
path = "src/bin/vectors.rs"
[[bin]]
name = "measure"
path = "src/bin/measure.rs"
