# wrap-core: the hashes both halves of the bridge must agree on, byte for byte:
# the vault's deposit leaf and SHA-256 tree (vault/src/WrapVault.sol), the
# hiding commitments and nullifiers, the storage slot of `knownRoot[root]`,
# and the LEZ-side burn tree. Pure functions: the LEZ program, the executor
# tests and the client all link this one crate.
[package]
name = "wrap-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2.0", features = ["keccak"] }
borsh = { version = "1.5", features = ["derive"] }

[features]
# The zero-knowledge release (src/zk.rs): the guest and the client enable it;
# wrap_bridge does not, and its committed binary does not change with it.
zk = []

[dev-dependencies]
hex = "0.4"
